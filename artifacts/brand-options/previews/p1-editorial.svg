<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>P1 — Editorial</title><g font-family="Arial, Helvetica, sans-serif" fill="#111111"><rect width="1200" height="630" fill="#ffffff"/><text x="72" y="98" font-size="30" fill="#111111" letter-spacing="2">[ˈskriː.boː]</text><text x="72" y="268" font-size="90" font-family="Georgia, Times New Roman, serif">Evidence for</text><text x="72" y="378" font-size="90" font-family="Georgia, Times New Roman, serif">thoughtful feedback.</text><path d="M72 520H1128" stroke="#d6d6d6"/><text x="72" y="568" font-size="24" fill="#5c5c5c">Write. Replay. Respond.</text><text x="1128" y="568" font-size="22" text-anchor="end" fill="#111111" letter-spacing="2">SKRIBO</text></g></svg>
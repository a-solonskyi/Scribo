<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>P4 — Margin notes</title><g font-family="Arial, Helvetica, sans-serif" fill="#111111"><rect width="1200" height="630" fill="#ffffff"/><text x="72" y="98" font-size="30" fill="#111111" letter-spacing="2">[ˈskriː.boː]</text><text x="72" y="266" font-size="81" font-family="Georgia, Times New Roman, serif">A closer look</text><text x="72" y="363" font-size="81" font-family="Georgia, Times New Roman, serif">at writing.</text><path d="M650 178V470" stroke="#d6d6d6"/><text x="700" y="210" font-size="20" letter-spacing="2" fill="#666666">IN THE MARGINS</text><text x="700" y="284" font-size="34" font-family="Georgia, Times New Roman, serif">Every draft begins</text><rect x="696" y="306" width="233" height="40" fill="#eeeeee"/><text x="700" y="337" font-size="34" font-family="Georgia, Times New Roman, serif">with a thought.</text><path d="M700 362H1080M700 380H1060M700 398H985" stroke="#d6d6d6" stroke-width="4"/><path d="M952 324C1070 323 1110 368 1094 418M1094 418l-8-13M1094 418l15-5" fill="none" stroke="#111" stroke-width="2"/><text x="745" y="454" font-size="26" font-family="Georgia, Times New Roman, serif" font-style="italic">Where could this idea go?</text><path d="M72 520H1128" stroke="#d6d6d6"/><text x="72" y="568" font-size="24" fill="#5c5c5c">Make room for thoughtful feedback.</text><text x="1128" y="568" font-size="22" text-anchor="end" fill="#111111" letter-spacing="2">SKRIBO</text></g></svg>
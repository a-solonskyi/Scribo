<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>P3 — Process</title><g font-family="Arial, Helvetica, sans-serif" fill="#111111"><rect width="1200" height="630" fill="#ffffff"/><text x="72" y="98" font-size="30" fill="#111111" letter-spacing="2">[ˈskriː.boː]</text><text x="72" y="214" font-size="70" font-family="Georgia, Times New Roman, serif">See how ideas take shape.</text><path d="M72 255H1128" stroke="#d6d6d6"/><text x="72" y="300" font-size="20" letter-spacing="2">01 / WRITE</text><text x="450" y="300" font-size="20" letter-spacing="2">02 / REPLAY</text><text x="828" y="300" font-size="20" letter-spacing="2">03 / RESPOND</text><text x="72" y="364" font-size="31" font-family="Georgia, Times New Roman, serif">An idea begins</text><path d="M72 389H316M72 417H266M72 445H298" stroke="#c9c9c9" stroke-width="5"/><path d="M321 340V370" stroke="#111" stroke-width="3"/><path d="M450 447H748" stroke="#d6d6d6"/><path d="M450 349H520M450 389H585M450 429H722" stroke="#111" stroke-width="10"/><circle cx="722" cy="429" r="8" fill="#111"/><text x="828" y="364" font-size="31" font-family="Georgia, Times New Roman, serif">A clearer thought.</text><path d="M828 374Q955 381 1095 373" fill="none" stroke="#111" stroke-width="2"/><text x="828" y="424" font-size="23" >Highlight. Comment.</text><text x="828" y="455" font-size="23" >Start a conversation.</text><path d="M72 520H1128" stroke="#d6d6d6"/><text x="72" y="568" font-size="24" fill="#5c5c5c">Evidence for thoughtful feedback.</text><text x="1128" y="568" font-size="22" text-anchor="end" fill="#111111" letter-spacing="2">SKRIBO</text></g></svg>
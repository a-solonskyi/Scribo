<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>P5 — Signature</title><g font-family="Arial, Helvetica, sans-serif" fill="#111111"><rect width="1200" height="630" fill="#ffffff"/><text x="72" y="98" font-size="23" letter-spacing="2">THE WRITING PROCESS, IN VIEW.</text><text x="65" y="327" font-size="204" font-family="Georgia, Times New Roman, serif">skribo</text><text x="738" y="310" font-size="44" letter-spacing="1">[ˈskriː.boː]</text><text x="72" y="433" font-size="43" font-family="Georgia, Times New Roman, serif">Writing is more than the final draft.</text><path d="M72 520H1128" stroke="#d6d6d6"/><text x="72" y="568" font-size="24" fill="#5c5c5c">Essay writing. Process insights. Professor response.</text><text x="1128" y="568" font-size="22" text-anchor="end" fill="#111111" letter-spacing="2">SKRIBO</text></g></svg>